name: OpenCode Go DeepSeek API Smoke

on:
  push:
    branches: [main]
    paths:
      - 'packages/opencode_go.py'
      - 'packages/segmentation_gemini/client.py'
      - '.github/workflows/opencode-go-api-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-go-api-smoke
  cancel-in-progress: true

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      OPENCODE_GO_MODEL: deepseek-v4.1-flash
      OPENCODE_GO_MAX_TOKENS: '128'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal client dependency
        run: python -m pip install --disable-pip-version-check requests pydantic python-dotenv
      - name: Send one minimal DeepSeek API request and validate JSON
        run: |
          python - <<'PY'
          import json
          import os
          from packages.opencode_go import generate_chat_completion

          response = generate_chat_completion(
              os.environ.get("OPENCODE_GO_MODEL"),
              [
                  "Return exactly one JSON object, with no markdown or explanation. "
                  "Use the shape: {\"status\":\"ok\",\"model\":\"deepseek-v4.1-flash\"}.",
                  "API connectivity test only. Do not answer anything else."
              ],
              generation_config={"temperature": 0},
              request_options={"timeout": 60},
              attempts=2,
          )
          result = json.loads(response.text)
          assert result.get("status") == "ok", "Model response did not contain status=ok"
          print(json.dumps({
              "result": "PASS",
              "model": response.model,
              "responseValidated": True,
              "sessionHeaderPresent": True,
          }))
          PY

      - name: Verify real OpenCode Go subtitle polishing returns aligned lines
        run: |
          python - <<'PY'
          import json
          from packages.segmentation_gemini.client import polish_subtitles_bulk

          result = polish_subtitles_bulk([
              {
                  "index": 77,
                  "lines": ["今日は晴れです", "午後は散歩に行きます"],
              }
          ], concept="日本語字幕の校正")
          polished = result.get(77)
          assert isinstance(polished, list), "Subtitle polisher returned no validated result for clip 77"
          assert len(polished) == 2, f"Expected 2 aligned lines, got {len(polished)}"
          assert all(isinstance(line, str) and line.strip() for line in polished), "Polisher returned an empty or non-string line"
          print(json.dumps({
              "result": "PASS",
              "validatedClipCount": 1,
              "lineCount": len(polished),
              "lineAlignmentPreserved": True,
          }, ensure_ascii=False))
          PY

name: Probe GitHub-hosted YouTube alternatives

on:
  pull_request:
    paths:
      - 'scripts/probe-youtubejs.mjs'
      - 'scripts/probe-rapidapi-yt-api.py'
      - 'scripts/probe-rapidapi-youtube-cdn.py'
      - 'scripts/probe-cobalt.py'
      - 'scripts/probe-playwright-browser.py'
      - '.github/workflows/probe-download-alternatives.yml'
  workflow_dispatch:

jobs:
  youtubejs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install probe dependencies
        run: npm install --no-save youtubei.js@18.1.0
      - name: Download with YouTube.js
        run: |
          mkdir -p tmp
          node scripts/probe-youtubejs.mjs jNQXAC9IVRw tmp/youtubejs.mp4
      - name: Verify output
        run: |
          test -s tmp/youtubejs.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 tmp/youtubejs.mp4 | grep -qx video


  rapidapi-yt-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: python -m pip install requests
      - name: Download through hosted YT-API
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          mkdir -p tmp
          python scripts/probe-rapidapi-yt-api.py jNQXAC9IVRw tmp/rapidapi.mp4
      - name: Verify output
        run: |
          test -s tmp/rapidapi.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 tmp/rapidapi.mp4 | grep -qx video


  rapidapi-youtube-cdn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: python -m pip install requests
      - name: Download through hosted YouTube CDN provider
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          mkdir -p tmp
          python scripts/probe-rapidapi-youtube-cdn.py jNQXAC9IVRw tmp/rapidapi-cdn.mp4
      - name: Verify output
        run: |
          test -s tmp/rapidapi-cdn.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 tmp/rapidapi-cdn.mp4 | grep -qx video
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 tmp/rapidapi-cdn.mp4 | grep -qx audio


  cobalt-session-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: python -m pip install requests
      - name: Start Cobalt and YouTube session generator
        run: |
          docker network create cobalt-probe
          docker run -d --rm --name yt-session-generator \
            --network cobalt-probe \
            -p 127.0.0.1:8080:8080 \
            --init \
            ghcr.io/imputnet/yt-session-generator:webserver

          echo "Waiting for yt-session-generator..."
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/token >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "yt-session-generator did not become ready." >&2
            docker ps -a --filter name=yt-session-generator
            exit 1
          fi

          docker run -d --rm --name cobalt-probe \
            --network cobalt-probe \
            -p 127.0.0.1:9000:9000 \
            -e API_URL=http://127.0.0.1:9000/ \
            -e YOUTUBE_SESSION_SERVER=http://yt-session-generator:8080/ \
            -e YOUTUBE_SESSION_INNERTUBE_CLIENT=WEB_EMBEDDED \
            --init \
            ghcr.io/imputnet/cobalt:11

          echo "Waiting for Cobalt..."
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:9000/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Cobalt did not become ready." >&2
            docker ps -a --filter name=cobalt-probe
            exit 1
          fi
      - name: Download through local Cobalt tunnel
        run: |
          mkdir -p tmp
          python scripts/probe-cobalt.py jNQXAC9IVRw tmp/cobalt.mp4
      - name: Verify output
        run: |
          test -s tmp/cobalt.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 tmp/cobalt.mp4 | grep -qx video
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 tmp/cobalt.mp4 | grep -qx audio


  playwright-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium and dependencies
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Download through real browser playback
        run: |
          mkdir -p tmp
          python scripts/probe-playwright-browser.py jNQXAC9IVRw tmp/playwright.mp4
      - name: Verify output
        run: |
          test -s tmp/playwright.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 tmp/playwright.mp4 | grep -qx video
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 tmp/playwright.mp4 | grep -qx audio

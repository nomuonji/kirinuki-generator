name: Probe GitHub-hosted YouTube alternatives

on:
  pull_request:
    paths:
      - 'scripts/probe-youtubejs.mjs'
      - 'scripts/probe-rapidapi-yt-api.py'
      - 'scripts/probe-rapidapi-youtube-cdn.py'
      - '.github/workflows/probe-download-alternatives.yml'
  workflow_dispatch:

jobs:
  youtubejs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install probe dependencies
        run: npm install --no-save youtubei.js@18.1.0
      - name: Download with YouTube.js
        run: |
          mkdir -p tmp
          node scripts/probe-youtubejs.mjs jNQXAC9IVRw tmp/youtubejs.mp4
      - name: Verify output
        run: |
          test -s tmp/youtubejs.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 tmp/youtubejs.mp4 | grep -qx video


  rapidapi-yt-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: python -m pip install requests
      - name: Download through hosted YT-API
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          mkdir -p tmp
          python scripts/probe-rapidapi-yt-api.py jNQXAC9IVRw tmp/rapidapi.mp4
      - name: Verify output
        run: |
          test -s tmp/rapidapi.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 tmp/rapidapi.mp4 | grep -qx video


  rapidapi-youtube-cdn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: python -m pip install requests
      - name: Download through hosted YouTube CDN provider
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          mkdir -p tmp
          python scripts/probe-rapidapi-youtube-cdn.py jNQXAC9IVRw tmp/rapidapi-cdn.mp4
      - name: Verify output
        run: |
          test -s tmp/rapidapi-cdn.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 tmp/rapidapi-cdn.mp4 | grep -qx video
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 tmp/rapidapi-cdn.mp4 | grep -qx audio

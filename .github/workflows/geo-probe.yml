name: Geo Probe (diagnostic)

# Throwaway diagnostic: works out whether a region-locked video can be reached from a
# GitHub-hosted runner using only free, built-in means. Delete once the answer is known.

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Region-locked video ID to probe'
        required: true
        default: 'QtJaxvkkT_8'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'

    steps:
    - name: Where is this runner?
      run: |
        echo "--- runner egress ---"
        curl -s --max-time 20 https://ipinfo.io/json || echo "(ipinfo unavailable)"

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Install yt-dlp
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade yt-dlp
        python -m yt_dlp --version

    - name: Probe each free bypass option
      env:
        VIDEO_ID: ${{ github.event.inputs.video_id }}
      run: |
        url="https://www.youtube.com/watch?v=$VIDEO_ID"

        try() {
          name="$1"; shift
          echo ""
          echo "=================================================="
          echo "ATTEMPT: $name"
          echo "=================================================="
          if timeout 180 python -m yt_dlp --no-update --simulate --no-warnings \
               --print "RESULT|%(title)s|%(duration)s" "$@" "$url" 2>&1 | tail -8; then
            echo ">>> $name: reachable"
          else
            echo ">>> $name: BLOCKED"
          fi
        }

        # Baseline: confirms the block is still in effect from this runner.
        try "plain" --js-runtimes deno --remote-components ejs:npm

        # yt-dlp's built-in geo bypass spoofs X-Forwarded-For. Costs nothing to try,
        # though YouTube is widely believed to geo-locate by connection IP.
        try "--geo-bypass" --js-runtimes deno --remote-components ejs:npm --geo-bypass
        try "--xff JP" --js-runtimes deno --remote-components ejs:npm --xff JP
        try "--xff JP + tv client" --js-runtimes deno --remote-components ejs:npm \
            --xff JP --extractor-args "youtube:player_client=tv_simply"

        # Some clients resolve playback through a different endpoint and occasionally
        # sidestep the restriction.
        try "android_vr client" --js-runtimes deno --remote-components ejs:npm \
            --extractor-args "youtube:player_client=android_vr"
        try "ios client" --js-runtimes deno --remote-components ejs:npm \
            --extractor-args "youtube:player_client=ios"
        try "mweb client" --js-runtimes deno --remote-components ejs:npm \
            --extractor-args "youtube:player_client=mweb"

        echo ""
        echo "=================================================="
        echo "Probe complete. Any line reading 'reachable' above"
        echo "means that flag combination defeats the geo block."
        echo "=================================================="

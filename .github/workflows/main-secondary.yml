name: Secondary Kirinuki Generator

on:
  workflow_dispatch:
    inputs:
      youtube_channel_id:
        description: 'YouTube Channel ID'
        required: true
        default: 'UCj14-CcW0idWlvh3kQp683A'
      gdrive_folder_id:
        description: 'Google Drive Folder ID'
        required: true
        default: '1jMRNXRibmoOShZi1EJMcUySNoXwe1LNX'
  schedule:
    # Staggered an hour after the primary channel so two 2h+ pipelines never overlap.
    - cron: '7 6 * * *' # Runs every day at 06:07 UTC

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    # GitHub kills a job at 6h with no chance to save state. Stop short of that so the
    # run ends cleanly and the next one can resume.
    timeout-minutes: 340
    env:
      PUPPETEER_CACHE_DIR: ~/.cache/puppeteer
      REMOTION_BROWSER_CACHE_DIR: ~/.cache/remotion
      # Define Channel and Folder IDs for scheduled runs
      YOUTUBE_CHANNEL_ID_SCHEDULED: "UCj14-CcW0idWlvh3kQp683A"
      GDRIVE_FOLDER_ID_SCHEDULED: "1jMRNXRibmoOShZi1EJMcUySNoXwe1LNX"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: apps/remotion/package-lock.json

    - name: Set up Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Prepare browser cache directories
      run: |
        mkdir -p ~/.cache/puppeteer
        mkdir -p ~/.cache/remotion
        mkdir -p ~/.remotion
      shell: bash

    - name: Cache Remotion browser artifacts
      uses: actions/cache@v3
      id: remotion-browser-cache
      with:
        path: |
          ~/.cache/puppeteer
          ~/.cache/remotion
          ~/.remotion
        key: ${{ runner.os }}-remotion-browser-${{ hashFiles('apps/remotion/package-lock.json') }}

    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # YouTube breaks older yt-dlp releases regularly; a pinned floor is not enough.
        python -m pip install --upgrade yt-dlp
        python -m yt_dlp --version
        playwright install chromium --with-deps

    - name: Install Node.js dependencies for Remotion
      run: npm install
      working-directory: ./apps/remotion

    - name: Ensure Remotion browser is available
      run: npx remotion browser ensure --log=warn || npx remotion browser ensure
      working-directory: ./apps/remotion

    - name: Create cookie file from secret
      env:
        YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
      # `echo` writes a 1-byte newline when the secret is unset, and download_video.py used
      # to hand any existing file to yt-dlp. An empty or rotated cookie jar makes YouTube
      # reject requests that succeed anonymously, so only keep a non-empty file.
      run: |
        printf '%s' "$YT_COOKIES_TXT" > cookies.txt
        [ -s cookies.txt ] || rm -f cookies.txt

    - name: Run YouTube Watcher and Processor
      env:
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        YOUTUBE_CHANNEL_ID: ${{ github.event.inputs.youtube_channel_id || env.YOUTUBE_CHANNEL_ID_SCHEDULED }}
        GDRIVE_PARENT_FOLDER_ID: ${{ github.event.inputs.gdrive_folder_id || env.GDRIVE_FOLDER_ID_SCHEDULED }}
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
        GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      run: python youtube_watcher.py

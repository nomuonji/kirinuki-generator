name: Tertiary Kirinuki Generator

on:
  schedule:
    - cron: '37 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      youtube_channel_id:
        description: 'YouTube Channel ID'
        required: true
        default: 'UC0yQ2h4gQXmVUFWZSqlMVOA'
      gdrive_folder_id:
        description: 'Google Drive Folder ID'
        required: true
        default: '1hnjNbsTqxwhgT98MZrzRvm4rgVNWtxuY'

concurrency:
  group: kirinuki-tertiary
  cancel-in-progress: false

env:
  YOUTUBE_CHANNEL_ID_SCHEDULED: "UC0yQ2h4gQXmVUFWZSqlMVOA"
  # Preserve the historical scheduled destination. Manual dispatch keeps its own default.
  GDRIVE_FOLDER_ID_SCHEDULED: "12ZiVI-m7HzdI9ittQZKwt0vT5YvZiHQ4"
  CLIP_POSTS_PER_DAY: '2'
  CLIP_STOCK_TARGET_DAYS: '7'
  CLIP_STOCK_REORDER_DAYS: '3'
  MAX_VIDEOS_PER_RUN: '2'
  CLIPS_PER_SOURCE_CAP: '8'
  MAX_SEARCH_VIDEOS: '30'
  SAVETUBE_QUALITY: '720'
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_process: ${{ steps.plan.outputs.should_process }}
      stock: ${{ steps.plan.outputs.stock }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install planning dependencies
        run: |
          python -m pip install --disable-pip-version-check             python-dotenv google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Evaluate posting stock and source candidates
        id: plan
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ github.event.inputs.youtube_channel_id || env.YOUTUBE_CHANNEL_ID_SCHEDULED }}
          GDRIVE_PARENT_FOLDER_ID: ${{ github.event.inputs.gdrive_folder_id || env.GDRIVE_FOLDER_ID_SCHEDULED }}
          GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          python youtube_watcher.py --plan-only --plan-output plan.json
          echo "should_process=$(python -c 'import json; print(str(json.load(open("plan.json"))["shouldProcess"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "stock=$(python -c 'import json; print(json.load(open("plan.json"))["effectiveStockClips"])')" >> "$GITHUB_OUTPUT"

  build-and-upload:
    needs: plan
    if: needs.plan.outputs.should_process == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PUPPETEER_CACHE_DIR: ~/.cache/puppeteer
      REMOTION_BROWSER_CACHE_DIR: ~/.cache/remotion

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/remotion/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Prepare and cache Remotion browser
        run: mkdir -p ~/.cache/puppeteer ~/.cache/remotion ~/.remotion
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/puppeteer
            ~/.cache/remotion
            ~/.remotion
          key: ${{ runner.os }}-remotion-browser-${{ hashFiles('apps/remotion/package-lock.json') }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install -U --pre "yt-dlp[default]" bgutil-ytdlp-pot-provider
      - name: Install Remotion dependencies
        working-directory: ./apps/remotion
        run: npm ci
      - name: Ensure Remotion browser is available
        working-directory: ./apps/remotion
        run: npx remotion browser ensure --log=warn || npx remotion browser ensure
      - name: Create cookie file for yt-dlp fallback
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          printf '%s' "$YT_COOKIES_TXT" > cookies.txt
          [ -s cookies.txt ] || rm -f cookies.txt
      - name: Replenish clip stock
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ github.event.inputs.youtube_channel_id || env.YOUTUBE_CHANNEL_ID_SCHEDULED }}
          GDRIVE_PARENT_FOLDER_ID: ${{ github.event.inputs.gdrive_folder_id || env.GDRIVE_FOLDER_ID_SCHEDULED }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python youtube_watcher.py

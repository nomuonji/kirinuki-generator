name: One-time Zizek RapidAPI caption intake to private Drive

# The trusted main merge activates this workflow; no PR secrets.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/annotated-world-zizek-rapidapi.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: annotated-world-zizek-rapidapi-intake
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing caption and Drive API dependencies
        run: python -m pip install -q --disable-pip-version-check python-dotenv requests youtube-transcript-api google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Export candidate captions to non-shared Google Drive (never artifact)
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: PYTHONPATH=. python scripts/annotated_world_caption_export.py

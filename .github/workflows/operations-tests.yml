name: Operations Logic Tests

on:
  pull_request:
    paths:
      - 'youtube_watcher.py'
      - 'run_all.py'
      - 'download_video.py'
      - 'packages/operations.py'
      - 'packages/quality_gate.py'
      - 'packages/publish_scheduler.py'
      - 'packages/github_ledger.py'
      - 'packages/youtube_direct.py'
      - 'scripts/autonomous_direct.py'
      - 'scripts/private_render_smoke.py'
      - '.github/workflows/private-render-smoke.yml'
      - 'tests/test_direct_publish.py'
      - 'tests/test_youtube_direct.py'
      - 'tests/test_readiness.py'
      - 'scripts/kirinuki_readiness.py'
      - '.github/workflows/kirinuki-readiness.yml'
      - '.github/workflows/direct-tertiary.yml'
      - 'packages/segmentation_gemini/client.py'
      - 'tests/test_quality_gate.py'
      - 'configs/video_concept_hiroyuki.md'
      - 'packages/shared/gdrive.py'
      - 'apps/cli/generate_clips.py'
      - 'tests/test_operations.py'
      - '.github/workflows/main.yml'
      - '.github/workflows/main-secondary.yml'
      - '.github/workflows/main-tertiary.yml'
      - '.github/workflows/manual-run.yml'
      - '.github/workflows/operations-tests.yml'
  workflow_dispatch:

jobs:
  operations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile changed Python modules
        run: |
          python -m py_compile             packages/operations.py             packages/shared/gdrive.py             youtube_watcher.py             run_all.py             download_video.py             apps/cli/generate_clips.py             packages/quality_gate.py             packages/publish_scheduler.py             packages/github_ledger.py             packages/youtube_direct.py             scripts/autonomous_direct.py             scripts/kirinuki_readiness.py             scripts/private_render_smoke.py
      - name: Install direct publisher test dependencies
        run: python -m pip install --disable-pip-version-check requests google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Run operations unit tests
        run: python -m unittest -v tests.test_operations tests.test_quality_gate tests.test_direct_publish tests.test_youtube_direct tests.test_readiness
      - name: Verify direct workflow safely stays inactive without authorization
        run: |
          python -m scripts.autonomous_direct --plan-only --plan-output /tmp/kirinuki-plan.json
          python -c 'import json; p=json.load(open("/tmp/kirinuki-plan.json")); assert p["shouldProcess"] is False'


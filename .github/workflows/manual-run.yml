name: Manual Kirinuki Generator

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'YouTube Video ID to process'
        required: true
      gdrive_folder_id:
        description: 'Google Drive Folder ID for upload (blank = GDRIVE_PARENT_FOLDER_ID secret)'
        required: false
        default: ''
      max_clips:
        description: 'Maximum clips to generate from this source'
        required: false
        default: '6'

concurrency:
  # Blank folder means the primary production folder. Known secondary/tertiary folders
  # share their scheduled lock; other explicit folders get an isolated folder lock.
  group: ${{ github.event.inputs.gdrive_folder_id == '' && 'kirinuki-primary' || format('kirinuki-folder-{0}', github.event.inputs.gdrive_folder_id) }}
  cancel-in-progress: false

jobs:
  manual-build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PUPPETEER_CACHE_DIR: ~/.cache/puppeteer
      REMOTION_BROWSER_CACHE_DIR: ~/.cache/remotion
      SAVETUBE_QUALITY: '720'
  SOURCE_FETCH_COUNTRY: 'US'
      PYTHONUNBUFFERED: '1'
      KIRINUKI_TARGET_CLIPS: ${{ github.event.inputs.max_clips || '6' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/remotion/package-lock.json
      - name: Prepare browser cache directories
        run: mkdir -p ~/.cache/puppeteer ~/.cache/remotion ~/.remotion
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/puppeteer
            ~/.cache/remotion
            ~/.remotion
          key: ${{ runner.os }}-remotion-browser-${{ hashFiles('apps/remotion/package-lock.json') }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # yt-dlp/PO-token dependencies are installed by download_video.py only if SaveTube fails.
      - name: Install Remotion dependencies
        working-directory: ./apps/remotion
        run: npm ci
      - name: Ensure Remotion browser is available
        working-directory: ./apps/remotion
        run: npx remotion browser ensure --log=warn || npx remotion browser ensure
      - name: Create cookie file for yt-dlp fallback
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          printf '%s' "$YT_COOKIES_TXT" > cookies.txt
          [ -s cookies.txt ] || rm -f cookies.txt
      - name: Run pipeline
        env:
          VIDEO_ID: ${{ github.event.inputs.video_id }}
          GDRIVE_PARENT_FOLDER_ID: ${{ github.event.inputs.gdrive_folder_id || secrets.GDRIVE_PARENT_FOLDER_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_all.py "$VIDEO_ID" --subs --reaction

name: Bilibili private short render test
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/bilibili-private-short-test.yml']
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'test/bilibili-short-render-20261118' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      OPENCODE_GO_PROPOSAL_CHUNK_CHARS: '12000'
      OPENCODE_GO_MAX_TIMEOUT_SECONDS: '120'
      OPENCODE_GO_REASONING_EFFORT: low
      OPENCODE_GO_MODEL: deepseek-v4.1-flash
      HOOK_MODEL: deepseek-v4.1-flash
      KIRINUKI_REVIEW_MODEL: deepseek-v4.1-flash
      REACTION_MODEL: deepseek-v4.1-flash
      SOURCE_VIDEO_TITLE: 'CS50x 2025 Section — private technical test'
      SOURCE_VIDEO_ID: bilibili_BV1wg4tzeEAV_p1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/remotion/package-lock.json
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          dotnet tool install --tool-path "$RUNNER_TEMP/bbtools" BBDown --version 1.6.3
          echo "$RUNNER_TEMP/bbtools" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Acquire same-part MP4 and English CC
        run: |
          # CS50x 2025 Section, CC BY-NC-SA 4.0; noncommercial technical test.
          # https://cs50.harvard.edu/x/2025/license/
          python bilibili_source.py video BV1wg4tzeEAV --page 1 --rights-confirmed --output tmp/video.mp4
          python bilibili_source.py transcript BV1wg4tzeEAV --page 1 --language en --rights-confirmed --video tmp/video.mp4 --output tmp/transcript.json
          python - <<'PY'
          import json
          from pathlib import Path
          src = json.loads(Path("tmp/transcript.json").read_text())
          # Bound the AI test; retain actual timestamp offsets in source video.
          subset = [x for x in src if x["start"] >= 60 and x["end"] <= 360]
          assert len(subset) >= 20
          Path("tmp/window.json").write_text(json.dumps(subset, ensure_ascii=False), encoding="utf-8")
          print("ACTUAL_TRANSCRIPT_WINDOW_CUES", len(subset))
          PY
      - name: Install existing Remotion renderer
        working-directory: apps/remotion
        run: |
          npm ci
          npx remotion browser ensure --log=warn || npx remotion browser ensure
      - name: Generate and independently review one real clip
        env:
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: |
          set -eu
          mkdir -p private-report
          printf '%s\n' 'Create a self-contained short about a concrete programming concept with a clear explanation and payoff. The source captions are English. Titles can be Japanese; do not invent quotes or translate the audio claim into a different meaning. This is a noncommercial private technical test.' > tmp/concept.md
          # Raw model logs contain caption text: retain only in ephemeral runner.
          if timeout 420 python -m apps.cli.generate_clips --video tmp/video.mp4 --transcript tmp/window.json --out apps/remotion/public/out_clips --subs --concept-file tmp/concept.md --max-clips 1 --min-sec 30 --max-sec 45 > "$RUNNER_TEMP/clipgen.log" 2>&1; then
            python - <<'PY'
          import json
          from pathlib import Path
          from packages.quality_gate import validated_receipt
          d=Path("apps/remotion/public/out_clips")
          assert validated_receipt(d)
          clips=list(d.glob("clip_*.mp4"))
          candidates=json.loads((d/"clip_candidates.json").read_text())
          assert len(clips)==len(candidates)==1
          c=candidates[0]
          print("AI_SELECTION_AND_REVIEW_PASS", c["start"],c["end"])
          PY
          else
            # Report stage only, not private transcript or secrets.
            grep -E '^(Static quality gate:|Independent editorial gate:|Traceback|RuntimeError:|TimeoutError:|[A-Za-z]+Error:)' "$RUNNER_TEMP/clipgen.log" | cut -c1-180 | tail -n 5 || true
            exit 1
          fi
      - name: Prepare and render using production renderer
        run: |
          python -m apps.cli.render_clips --input-dir apps/remotion/public/out_clips
          python - <<'PY'
          from pathlib import Path
          from run_all import run_remotion_render
          from packages.quality_gate import verify_rendered_media
          import json, subprocess
          props=Path("apps/remotion/public/props")
          p=list(props.glob("clip_*.json"))
          assert len(p)==1
          data=json.loads(p[0].read_text())
          assert data.get("subtitleTimeline"), "No rendered subtitle timeline"
          out=Path("private-rendered")
          run_remotion_render(props,out,Path("apps/remotion"))
          files=list(out.glob("*.mp4"))
          assert len(files)==1
          qa=verify_rendered_media(files[0])
          subprocess.run(["ffmpeg","-v","error","-xerror","-i",str(files[0]),"-map","0:v:0","-map","0:a:0","-f","null","-"],check=True,timeout=120)
          report={"result":"PASS","source":"BV1wg4tzeEAV","sourceLicense":"CC BY-NC-SA 4.0, private noncommercial diagnostic","sourceLanguage":"en","subtitleCues":len(data["subtitleTimeline"]),"aiSelection":True,"editorialReview":True,"media":qa,"fullDecode":True,"publicationAttempted":False}
          Path("private-report/report.json").write_text(json.dumps(report,indent=2), encoding="utf-8")
          print("BILIBILI_SHORT_REPORT",json.dumps(report))
          PY
      - name: Save redacted test report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-private-short-report
          path: private-report/report.json
          if-no-files-found: ignore
          retention-days: 7

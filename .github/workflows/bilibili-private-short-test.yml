name: Kyousuki watermark and short preview diagnostic
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/bilibili-private-short-test.yml']
permissions:
  contents: read
jobs:
  preview:
    if: github.head_ref == 'test/bilibili-short-render-20261118' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          dotnet tool install --tool-path "$RUNNER_TEMP/bbtools" BBDown --version 1.6.3
          echo "$RUNNER_TEMP/bbtools" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Inspect ordinary public playback source (temporary media; no posting)
        shell: bash
        run: |
          set -eu
          mkdir -p tmp/source tmp/private-review
          cd tmp/source
          # Inspect the publicly listed raw-audio episode with normal guest access.
          # This diagnostic does not assert production or redistribution rights.
          timeout 240 BBDown 'https://www.bilibili.com/video/BV1PwjzzVELc/?p=1' --select-page 1 --skip-subtitle --skip-cover --dfn-priority '480P 清晰,720P 高清,360P 流畅' --encoding-priority avc,hevc,av1 > "$RUNNER_TEMP/bbdown.log" 2>&1
          cd ../..
          python - <<'PY'
          import json
          from pathlib import Path
          from bilibili_source import video_duration
          import subprocess
          files=list(Path("tmp/source").rglob("*.mp4"))
          assert len(files)==1, "expected exactly one source MP4"
          media=Path("tmp/source.mp4")
          files[0].replace(media)
          duration=video_duration(media)
          print("ACTUAL_EPISODE_MEDIA",media.stat().st_size,duration)
          # Preserve the full original frame, including corners. No watermark removal.
          stamps=[min(duration-1,t) for t in [30,120,300,duration/2,duration*.8,duration-15]]
          for i,t in enumerate(stamps):
              subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-ss",str(t),"-i",str(media),"-frames:v","1","-vf","scale=640:-2","-y",f"tmp/private-review/frame-{i+1}.jpg"],check=True,timeout=35)
          # fixed 30-second segment to check raw frame and audio, not AI-selected
          start=min(300,max(0,duration-35))
          subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-ss",str(start),"-i",str(media),"-t","30","-map","0:v:0","-map","0:a:0","-vf","scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2:black,setsar=1","-c:v","libx264","-preset","veryfast","-crf","22","-c:a","aac","-movflags","+faststart","-y","tmp/private-review/vertical-check.mp4"],check=True,timeout=100)
          from packages.quality_gate import verify_rendered_media
          qa=verify_rendered_media(Path("tmp/private-review/vertical-check.mp4"))
          print("WATERMARK_PREVIEW_MEDIA",json.dumps(qa))
          # Check actual timed subtitle availability separately, never fabricate dialogue.
          import subprocess,sys
          available={}
          for lang in ("ja","zh"):
              p=subprocess.run([sys.executable,"-c","from bilibili_source import download_transcript; from pathlib import Path; download_transcript('BV1PwjzzVELc',1,Path('tmp/source.mp4'),Path('tmp/captions-"+lang+".json'),'"+lang+"')"],stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=210)
              path=Path("tmp/captions-"+lang+".json")
              available[lang]=len(json.loads(path.read_text())) if p.returncode==0 and path.exists() else 0
          report={"source":"BV1PwjzzVELc","sourceTitle":"今日好き マクタン編1話","sourceDuration":duration,"frameTimestamps":stamps,"previewStart":start,"previewMedia":qa,"subtitleCueCounts":available,"watermarkConclusion":"Visual inspection required; no removal performed","publicationAttempted":False}
          Path("tmp/private-review/report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("CAPTION_COUNTS",json.dumps(available))
          PY
      - name: Save small diagnostic preview to owner-only isolated Drive folder
        env:
          GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from googleapiclient.http import MediaFileUpload
          from packages.shared.gdrive import get_drive_service
          service=get_drive_service()
          folder=service.files().create(body={"name":"Kirinuki Watermark Review BV1PwjzzVELc 20261118","mimeType":"application/vnd.google-apps.folder"},fields="id,shared,permissions(type,role)").execute()
          if folder.get("shared") is not False or not folder.get("permissions") or any(p.get("type")!="user" or p.get("role")!="owner" for p in folder["permissions"]):
              raise RuntimeError("Review folder is not confirmed owner-only; refusing upload")
          for file in sorted(Path("tmp/private-review").iterdir()):
              media=MediaFileUpload(str(file),resumable=file.stat().st_size>5*1024*1024)
              res=service.files().create(body={"name":file.name,"parents":[folder["id"]]},media_body=media,fields="id,shared,permissions(type,role)").execute()
              if res.get("shared") is not False or not res.get("permissions") or any(p.get("type")!="user" or p.get("role")!="owner" for p in res["permissions"]):
                  service.files().delete(fileId=res["id"]).execute()
                  raise RuntimeError("Uploaded diagnostic file is not owner-only")
              print("PRIVATE_REVIEW_SAVED",file.name)
          PY
      - name: Remove downloaded media
        if: always()
        run: rm -rf tmp/source tmp/source.mp4 tmp/private-review tmp/captions-ja.json tmp/captions-zh.json

name: Kyousuki first-run production plan verification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/kyousuki-first-run-check.yml']
permissions:
  contents: read
jobs:
  plan:
    if: github.head_ref == 'probe/kyousuki-first-run' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      YOUTUBE_CHANNEL_ID: 'UCzXVsEc1h2Elljge0fnQYRg'
      CLIP_POSTS_PER_DAY: '2'
      CLIP_STOCK_TARGET_DAYS: '7'
      CLIP_STOCK_REORDER_DAYS: '3'
      MAX_VIDEOS_PER_RUN: '1'
      CLIPS_PER_SOURCE_CAP: '1'
      MAX_SEARCH_VIDEOS: '30'
      SOURCE_FETCH_COUNTRY: 'US'
      KYOUSUKI_PUBLIC_CATALOG: '1'
      KYOUSUKI_INDEX_FILE: '.kyousuki-index/state/kyousuki-index.json'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: kyousuki-index-state
          path: .kyousuki-index
          sparse-checkout: state/kyousuki-index.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install planning dependencies
        run: python -m pip install --disable-pip-version-check python-dotenv google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Execute existing one-source plan against live inventory
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}
          KYOUSUKI_APPROVALS_JSON: ${{ secrets.KYOUSUKI_APPROVALS_JSON }}
          GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          python youtube_watcher.py --plan-only --plan-output plan.json
          python - <<'PY'
          import json
          from packages.kyousuki_sources import approval_records, load_registry
          p=json.load(open('plan.json',encoding='utf-8'))
          pool=p.get('bilibiliSourcePool') or {}
          latest=pool.get('latestCatalogCandidate') or {}
          grants=approval_records(load_registry())
          result={"candidateCount":pool.get("candidateCount"),"latestEpisode":latest.get("episodeKey"),
             "latestBvid":latest.get("bvid"),"discoveryStatus":pool.get("status"),
             "stock":p.get("effectiveStockClips"),"approvedGrantCount":len(grants),
             "eligibleApprovedCandidates":pool.get("eligibleApprovedCandidates"),"selectedVideoIds":p.get("selectedVideoIds"),
             "shouldProcess":p.get("shouldProcess"),"reason":p.get("reason"),
             "blockers":p.get("blockingReasons",[]),"generated":0,"published":0}
          print("FIRST_RUN_PLAN",json.dumps(result,ensure_ascii=False),flush=True)
          if not p.get("shouldProcess"):
              raise SystemExit(1)
          PY

name: Kyousuki v5 hook-and-caption stock replacement

on:
  pull_request:
    paths:
      - 'scripts/kyousuki_upgrade_stock_v5.py'
      - 'tests/test_kyousuki_upgrade_stock_v5.py'
      - 'configs/kyousuki_v5_visual_review.json'
      - '.github/workflows/kyousuki-upgrade-stock-v5.yml'
  push:
    branches: [main]
    paths:
      - 'configs/kyousuki_v5_visual_review.json'

concurrency:
  group: kyousuki-v5-stock-replacement
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}
      GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Drive dependencies
        run: pip install --disable-pip-version-check google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Verify all-23 signed-off manifest and safe upgrade rules
        run: |
          python -m py_compile scripts/kyousuki_upgrade_stock_v5.py
          python -m unittest discover -s tests -p test_kyousuki_upgrade_stock_v5.py -v
      - name: Validate 23 real hashes, archive v4, and activate new v5 pairs
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          python -u -m scripts.kyousuki_upgrade_stock_v5 \
            --manifest configs/kyousuki_v5_visual_review.json | tee migration-v5.log
      - name: Upload migration receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyousuki-v5-stock-migration
          path: migration-v5.log
          if-no-files-found: ignore

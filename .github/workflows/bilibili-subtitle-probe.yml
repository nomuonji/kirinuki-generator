name: Bilibili subtitle availability probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/bilibili-subtitle-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'probe/bilibili-subtitles-20261118' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check normal public video metadata APIs
        shell: python
        run: |
          import json, urllib.request, urllib.parse, urllib.error
          ids = ["BV1xqveBfEpz", "BV1jL41167ZG"]
          def get(path, **query):
              url = "https://api.bilibili.com/" + path + "?" + urllib.parse.urlencode(query)
              try:
                  with urllib.request.urlopen(url, timeout=15) as r:
                      data = json.load(r)
                      print(path, "HTTP", r.status, "API code", data.get("code"), flush=True)
                      return data.get("data") or {} if data.get("code") == 0 else {}
              except urllib.error.HTTPError as e:
                  print(path, "HTTP", e.code, flush=True)
              except (OSError, ValueError) as e:
                  print(path, type(e).__name__, flush=True)
              return {}
          found = 0
          for bvid in ids:
              info = get("x/web-interface/view", bvid=bvid)
              cid = info.get("cid")
              print(bvid, "duration", info.get("duration"), "cid_present", bool(cid), flush=True)
              if not cid:
                  continue
              player = get("x/player/wbi/v2", bvid=bvid, cid=cid)
              tracks = (player.get("subtitle") or {}).get("subtitles") or []
              print(bvid, "caption_languages", [s.get("lan") for s in tracks], flush=True)
              found += bool(tracks)
          print("caption_metadata_available:", found, "of", len(ids), flush=True)
          raise SystemExit(0 if found else 1)

name: Bilibili video acquisition comparison
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/bilibili-subtitle-probe.yml']
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'probe/bilibili-subtitles-20261118' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        method: [yutto, bbdown, direct-control]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yutto
        if: matrix.method == 'yutto'
        run: python -m pip install yutto==2.3.1
      - name: Install BBDown
        if: matrix.method == 'bbdown'
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/bbtools" BBDown --version 1.6.3
          echo "$RUNNER_TEMP/bbtools" >> "$GITHUB_PATH"
      - name: Fetch licensed comparison media
        env:
          METHOD: ${{ matrix.method }}
        shell: bash
        run: |
          set -eu
          mkdir -p media
          # (c) copyright 2008 Blender Foundation / www.bigbuckbunny.org; CC BY 3.0.
          # Only normal public access. No credential, proxy, or evasion configuration.
          URL='https://www.bilibili.com/video/BV1Fb4111732/'
          case "$METHOD" in
            yutto) timeout 75 yutto "$URL" --no-danmaku --no-subtitle -q 32 -d media ;;
            bbdown) cd media; timeout 75 BBDown "$URL"; cd .. ;;
            direct-control) curl --fail --location --max-time 90 --output media/control.mp4 'https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_320x180.mp4' ;;
          esac
      - name: Verify actual media
        shell: python
        run: |
          import json, pathlib, subprocess
          files = list(pathlib.Path("media").rglob("*.mp4"))
          assert files, "No MP4 produced"
          for p in files:
              result = json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(p)]))
              streams = {s["codec_type"] for s in result["streams"]}
              duration = float(result["format"]["duration"])
              print("MEDIA_PROBE", p.stat().st_size, sorted(streams), duration)
              assert {"video","audio"} <= streams and duration > 0

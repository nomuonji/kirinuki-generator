name: Bilibili video bytes control probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/bilibili-subtitle-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'probe/bilibili-subtitles-20261118' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install yt-dlp==2026.10.26
      - name: Acquire openly licensed video and verify bytes and audio/video streams
        shell: bash
        run: |
          set -u
          # Big Buck Bunny (c) copyright 2008, Blender Foundation / www.bigbuckbunny.org,
          # CC BY 3.0, https://peach.blender.org/about/
          # No credentials, no proxy, no retry on access denial.
          if timeout 100 python -m yt_dlp --ignore-config --no-playlist --socket-timeout 15 --retries 0 --extractor-retries 0 -f 'bv*[height<=480]+ba/b[height<=480]' --merge-output-format mp4 -o 'sample.%(ext)s' 'https://www.bilibili.com/video/BV1Fb4111732/'; then
            python - <<'PY'
          import json, subprocess, pathlib
          p = pathlib.Path("sample.mp4")
          data = json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(p)]))
          kinds = {s["codec_type"] for s in data["streams"]}
          print("BILIBILI_MEDIA_BYTES",p.stat().st_size,"STREAMS",sorted(kinds),"DURATION",data["format"].get("duration"))
          assert {"video","audio"} <= kinds and float(data["format"]["duration"]) > 0
          PY
          else
            echo 'BILIBILI_MEDIA_FAILED'
            exit 1
          fi

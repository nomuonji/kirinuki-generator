name: Bilibili BBDown candidate availability
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/bilibili-subtitle-probe.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.head_ref == 'probe/bilibili-subtitles-20261118' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install tools
        run: |
          if ! command -v ffmpeg; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          dotnet tool install --tool-path "$RUNNER_TEMP/bbtools" BBDown --version 1.6.3
          echo "$RUNNER_TEMP/bbtools" >> "$GITHUB_PATH"
      - name: Resolve public format metadata only (no media payload)
        shell: bash
        run: |
          for id in BV1Fb4111732 BV1PwjzzVELc BV1yPJG6oEEN; do
            echo "METADATA_PROBE $id"
            timeout 30 BBDown "https://www.bilibili.com/video/$id/" --only-show-info > "$RUNNER_TEMP/$id.log" 2>&1
            code=$?
            # Print only public title and format descriptions; no resolved media URL.
            grep -E '视频标题|视频流|音频流|分辨率|时长|HTTP|异常|失败|\[[0-9]+\].*(AVC|HEVC|AV1|AAC|[0-9]p)' "$RUNNER_TEMP/$id.log" | head -n 35 || true
            echo "METADATA_EXIT $id $code"
          done

name: Bilibili subtitle availability probe
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/bilibili-subtitle-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.head_ref == 'probe/bilibili-subtitles-20261118' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade yt-dlp
      - name: Check public metadata and caption track availability only
        shell: python
        run: |
          import json, subprocess, sys
          ids = ["BV1xqveBfEpz", "BV1pCZ3YxE3i", "BV1Aq7XzSEGY", "BV1jL41167ZG"]
          found = 0
          for bvid in ids:
              url = "https://www.bilibili.com/video/" + bvid + "/?p=1"
              try:
                  result = subprocess.run([sys.executable, "-m", "yt_dlp", "--ignore-config", "--no-playlist", "--skip-download", "--dump-single-json", "--socket-timeout", "15", "--retries", "0", "--extractor-retries", "0", url], capture_output=True, text=True, timeout=55)
                  if result.returncode:
                      print(bvid, "extractor failed", result.stderr[-600:].replace("\n", " "), flush=True)
                      continue
                  data = json.loads(result.stdout)
                  tracks = {k: sorted({t.get("ext", "") for t in v}) for k,v in (data.get("subtitles") or {}).items() if k != "danmaku"}
                  auto = {k: sorted({t.get("ext", "") for t in v}) for k,v in (data.get("automatic_captions") or {}).items() if k != "danmaku"}
                  print(json.dumps({"bvid": bvid, "duration":data.get("duration"), "formats":len(data.get("formats") or []), "subtitle_tracks":tracks,"automatic_tracks":auto}, ensure_ascii=False), flush=True)
                  if result.stderr:
                      print("extractor notice:", result.stderr[-350:].replace("\n", " "), flush=True)
                  if tracks or auto:
                      found += 1
              except (subprocess.TimeoutExpired, ValueError) as exc:
                  print(bvid, type(exc).__name__, flush=True)
          print("caption_metadata_available:", found, "of", len(ids), flush=True)
          sys.exit(0 if found else 1)

name: One-shot complete Žižek 1533-caption Japanese translation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/annotated-world-full-translation.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: annotated-world-full-translation
  cancel-in-progress: false
jobs:
  translate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      OPENCODE_GO_MAX_TOKENS: '8192'
      OPENCODE_GO_REASONING_EFFORT: 'none'
      OPENCODE_GO_MAX_TIMEOUT_SECONDS: '150'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing translation and Drive dependencies
        run: python -m pip install -q --disable-pip-version-check requests python-dotenv google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Translate ALL 1533 subtitle cues, assert coverage and export bilingual chapters privately
        run: PYTHONPATH=. python scripts/annotated_world_full_transcript.py

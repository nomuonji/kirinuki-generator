name: Kirinuki Production Readiness

on:
  schedule:
    # Read-only readiness diagnosis twice daily; does not produce or publish clips.
    - cron: '17 0,12 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/kirinuki-readiness.yml'
      - '.github/workflows/direct-tertiary.yml'
      - 'scripts/kirinuki_readiness.py'
      - 'packages/youtube_direct.py'
      - 'scripts/autonomous_direct.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      KIRINUKI_AUTOPUBLISH_ENABLED: ${{ vars.KIRINUKI_AUTOPUBLISH_ENABLED }}
      KIRINUKI_SOURCE_RIGHTS_APPROVED: ${{ vars.KIRINUKI_SOURCE_RIGHTS_APPROVED }}
      KIRINUKI_CHANNEL_AUTHORIZED: ${{ vars.KIRINUKI_CHANNEL_AUTHORIZED }}
      YOUTUBE_DESTINATION_CHANNEL_ID: ${{ vars.KIRINUKI_DESTINATION_CHANNEL_ID || secrets.KIRINUKI_DESTINATION_CHANNEL_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YT_CLIENT_ID_HIROYUKI || secrets.YOUTUBE_CLIENT_ID || secrets.YOUTUBE_OAUTH_CLIENT_ID || secrets.KIRINUKI_YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET_HIROYUKI || secrets.YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_OAUTH_CLIENT_SECRET || secrets.KIRINUKI_YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_HIROYUKI || secrets.YOUTUBE_REFRESH_TOKEN || secrets.YOUTUBE_OAUTH_REFRESH_TOKEN || secrets.KIRINUKI_YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only OAuth client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Inspect configuration and read-only destination authorization
        run: python -m scripts.kirinuki_readiness --output readiness.json --verify-oauth
      - name: Reject false-green production status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('readiness.json').read_text(encoding='utf-8'))
          if not r['productionReadyByConfiguration']:
              print('::error::Hiroyuki publisher blocked: ' + ', '.join(r['blockers']))
              raise SystemExit(1)
          PY
      - name: Attach redacted readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kirinuki-production-readiness
          path: readiness.json
          retention-days: 7

  kyousuki-oauth:
    # Independent of Drive stock, publication approval and rendering locks.
    # Refresh even when the intended destination is not yet configured.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YT_CLIENT_ID_KYOUSUKI }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET_KYOUSUKI }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_KYOUSUKI }}
      YOUTUBE_DESTINATION_CHANNEL_ID: ${{ vars.KYOUSUKI_DESTINATION_CHANNEL_ID }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh Kyousuki access and verify destination (read-only)
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          names = ("YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN")
          missing = [name for name in names if not os.environ.get(name, "").strip()]
          dest = os.environ.get("YOUTUBE_DESTINATION_CHANNEL_ID", "").strip()
          report = {"missingCredentials": missing, "destinationConfigured": bool(dest),
                    "tokenCheck": "not_checked", "destinationCheck": "not_checked"}
          stage = "tokenCheck"
          if not missing:
              try:
                  data = urllib.parse.urlencode({
                      "client_id": os.environ[names[0]], "client_secret": os.environ[names[1]],
                      "refresh_token": os.environ[names[2]], "grant_type": "refresh_token"
                  }).encode()
                  with urllib.request.urlopen("https://oauth2.googleapis.com/token", data=data, timeout=15) as resp:
                      token = json.load(resp)["access_token"]
                  report["tokenCheck"] = "refreshed"
                  stage = "destinationCheck"
                  request = urllib.request.Request(
                      "https://www.googleapis.com/youtube/v3/channels?part=id&mine=true",
                      headers={"Authorization": "Bearer " + token})
                  with urllib.request.urlopen(request, timeout=15) as resp:
                      ids = [row["id"] for row in json.load(resp).get("items", [])]
                  if not dest:
                      report[stage] = "destination_missing" if ids else "no_channel"
                  elif dest == "UCzXVsEc1h2Elljge0fnQYRg":
                      report[stage] = "source_channel_is_not_destination"
                  else:
                      report[stage] = "verified" if dest in ids else "channel_mismatch"
              except urllib.error.HTTPError as exc:
                  code = "http_" + str(exc.code)
                  if stage == "tokenCheck":
                      try:
                          candidate = json.load(exc).get("error")
                          if candidate in ("invalid_grant", "unauthorized_client", "invalid_client",
                                           "invalid_scope", "temporarily_unavailable"):
                              code = candidate
                      except Exception:
                          pass
                  report[stage] = code
              except Exception as exc:
                  report[stage] = type(exc).__name__
          else:
              report["tokenCheck"] = "missing_credentials"
          print("KYOUSUKI_OAUTH_HEALTH", json.dumps(report), flush=True)
          if report["tokenCheck"] != "refreshed" or report["destinationCheck"] != "verified":
              print("::error::Kyousuki OAuth or destination verification failed")
              raise SystemExit(1)
          PY

name: Kyousuki approved stock publisher
on:
  schedule:
    - cron: '47 0,12 * * *'
  workflow_run:
    workflows: ['Kirinuki Production Readiness']
    types: [completed]
  workflow_dispatch:
    inputs:
      execute:
        description: 'Schedule one explicitly approved clip (otherwise read-only)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/kyousuki-publisher.yml'
      - 'scripts/kyousuki_publish.py'
  pull_request:
    paths:
      - 'scripts/kyousuki_publish.py'
      - 'tests/test_kyousuki_publish.py'
      - 'packages/youtube_direct.py'
      - '.github/workflows/kyousuki-publisher.yml'
concurrency:
  group: ${{ github.event_name == 'pull_request' && 'kyousuki-publisher-readonly-ci' || 'kyousuki-publisher' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}
      GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      KYOUSUKI_APPROVALS_JSON: ${{ secrets.KYOUSUKI_APPROVALS_JSON }}
      KIRINUKI_DIRECT_MODE: 'true'
      KIRINUKI_AUTOPUBLISH_ENABLED: ${{ vars.KYOUSUKI_AUTOPUBLISH_ENABLED }}
      KIRINUKI_SOURCE_RIGHTS_APPROVED: ${{ vars.KYOUSUKI_SOURCE_RIGHTS_APPROVED }}
      KIRINUKI_CHANNEL_AUTHORIZED: ${{ vars.KYOUSUKI_CHANNEL_AUTHORIZED }}
      YOUTUBE_DESTINATION_CHANNEL_ID: ${{ vars.KYOUSUKI_DESTINATION_CHANNEL_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YT_CLIENT_ID_KYOUSUKI }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET_KYOUSUKI }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_KYOUSUKI }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth-httplib2 google-auth-oauthlib requests python-dotenv
      - name: Check publication receipt rules and upload helper
        run: |
          python -m unittest discover -s tests -p 'test_kyousuki_publish.py' -v
          python -m unittest discover -s tests -p 'test_youtube_direct.py' -v
      - name: Read-only stock and destination readiness
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REQUIRE_READY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.execute) || github.event_name == 'push' }}
        run: |
          if [ "$REQUIRE_READY" = true ]; then
            python -m scripts.kyousuki_publish --require-ready
          else
            python -m scripts.kyousuki_publish
          fi
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_run' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.execute)) && vars.KYOUSUKI_AUTOPUBLISH_ENABLED == 'true' && vars.KYOUSUKI_CHANNEL_AUTHORIZED == 'true' && vars.KYOUSUKI_SOURCE_RIGHTS_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}
      GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      KYOUSUKI_APPROVALS_JSON: ${{ secrets.KYOUSUKI_APPROVALS_JSON }}
      KIRINUKI_DIRECT_MODE: 'true'
      KIRINUKI_AUTOPUBLISH_ENABLED: ${{ vars.KYOUSUKI_AUTOPUBLISH_ENABLED }}
      KIRINUKI_SOURCE_RIGHTS_APPROVED: ${{ vars.KYOUSUKI_SOURCE_RIGHTS_APPROVED }}
      KIRINUKI_CHANNEL_AUTHORIZED: ${{ vars.KYOUSUKI_CHANNEL_AUTHORIZED }}
      YOUTUBE_DESTINATION_CHANNEL_ID: ${{ vars.KYOUSUKI_DESTINATION_CHANNEL_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YT_CLIENT_ID_KYOUSUKI }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET_KYOUSUKI }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_KYOUSUKI }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check google-api-python-client google-auth-httplib2 google-auth-oauthlib requests python-dotenv
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m scripts.kyousuki_publish --execute

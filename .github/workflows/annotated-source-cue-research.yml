name: One-shot Annotated World source-cue research
run-name: "Caption cue audit — 4YSXNotY8QU (trusted main only)"
on:
  push:
    branches:
      - main
    paths:
      - scripts/annotated_source_caption_research.py
      - .github/workflows/annotated-source-cue-research.yml

permissions:
  contents: read

jobs:
  sample:
    # Never grant RAPIDAPI_KEY to pull_request, workflow_dispatch, forks, or unknown commits.
    if: >-
      github.repository == 'nomuonji/kirinuki-generator' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[caption-research-one-shot-20261121]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: annotated-caption-one-shot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q requests python-dotenv youtube-transcript-api
      - name: Read existing caption candidates with repository secret
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/annotated_source_caption_research.py

name: Automatic Kirinuki Generator

on:
  schedule:
    # 09:17 / 15:17 / 21:17 / 03:17 JST. Most runs stop after the cheap stock plan.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: kirinuki-primary
  cancel-in-progress: false

env:
  YOUTUBE_CHANNEL_ID: "UCzXVsEc1h2Elljge0fnQYRg"
  CLIP_POSTS_PER_DAY: '2'
  CLIP_STOCK_TARGET_DAYS: '7'
  CLIP_STOCK_REORDER_DAYS: '3'
  MAX_VIDEOS_PER_RUN: '2'
  CLIPS_PER_SOURCE_CAP: '6'
  MAX_SEARCH_VIDEOS: '30'
  SAVETUBE_QUALITY: '720'
  SOURCE_FETCH_COUNTRY: 'US'
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_process: ${{ steps.plan.outputs.should_process }}
      stock: ${{ steps.plan.outputs.stock }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install planning dependencies
        run: |
          python -m pip install --disable-pip-version-check python-dotenv google-api-python-client google-auth-httplib2 google-auth-oauthlib
      - name: Evaluate posting stock and source candidates
        id: plan
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}
          GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          python youtube_watcher.py --plan-only --plan-output plan.json
          echo "should_process=$(python -c 'import json; print(str(json.load(open("plan.json"))["shouldProcess"]).lower())')" >> "$GITHUB_OUTPUT"
          echo "stock=$(python -c 'import json; print(json.load(open("plan.json"))["effectiveStockClips"])')" >> "$GITHUB_OUTPUT"
          echo "reason=$(python -c 'import json; print(json.load(open("plan.json"))["reason"])')" >> "$GITHUB_OUTPUT"

  build-and-upload:
    needs: plan
    if: needs.plan.outputs.should_process == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PUPPETEER_CACHE_DIR: ~/.cache/puppeteer
      REMOTION_BROWSER_CACHE_DIR: ~/.cache/remotion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/remotion/package-lock.json

      - name: Prepare browser cache directories
        run: |
          mkdir -p ~/.cache/puppeteer ~/.cache/remotion ~/.remotion

      - name: Cache Remotion browser artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/puppeteer
            ~/.cache/remotion
            ~/.remotion
          key: ${{ runner.os }}-remotion-browser-${{ hashFiles('apps/remotion/package-lock.json') }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # yt-dlp/PO-token dependencies are installed by download_video.py only if SaveTube fails.

      - name: Install Remotion dependencies
        working-directory: ./apps/remotion
        run: npm ci

      - name: Ensure Remotion browser is available
        working-directory: ./apps/remotion
        run: npx remotion browser ensure --log=warn || npx remotion browser ensure

      - name: Create cookie file for yt-dlp fallback
        env:
          YT_COOKIES_TXT: ${{ secrets.YT_COOKIES_TXT }}
        run: |
          printf '%s' "$YT_COOKIES_TXT" > cookies.txt
          [ -s cookies.txt ] || rm -f cookies.txt

      - name: Replenish clip stock
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GDRIVE_PARENT_FOLDER_ID: ${{ secrets.GDRIVE_PARENT_FOLDER_ID }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_CLIENT_SECRET_JSON }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python youtube_watcher.py
